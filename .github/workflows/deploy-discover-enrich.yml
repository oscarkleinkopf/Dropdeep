name: Deploy discover-enrich (T53)

# Manual ops: redeploy Edge Function discover-enrich (OG/meta AliExpress).
# Secrets required (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
# Optional:
#   SUPABASE_PROJECT_REF   — default texzlizelxavrybkdjdj

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-discover-enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Deploy discover-enrich
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing secret SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          bash scripts/deploy-discover-enrich.sh
