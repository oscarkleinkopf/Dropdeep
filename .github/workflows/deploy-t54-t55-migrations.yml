name: Deploy T54/T55 migrations

# Apply report_feedback (006) + analytics_events (007).
# Secrets: SUPABASE_ACCESS_TOKEN (required), SUPABASE_PROJECT_REF / SUPABASE_DB_PASSWORD optional.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply 006 + 007
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing secret SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          bash scripts/deploy-t54-t55-migrations.sh
