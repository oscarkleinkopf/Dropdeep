name: Deploy discover-proxy (T45)

# Manual ops: redeploy Edge Function discover-proxy (AliExpress Affiliate).
# Secrets required (Settings → Secrets → Actions):
#   SUPABASE_ACCESS_TOKEN  — https://supabase.com/dashboard/account/tokens
# Optional:
#   SUPABASE_PROJECT_REF   — default texzlizelxavrybkdjdj
#
# AliExpress App Key/Secret are configured in the Supabase project, NOT here.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-discover-proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Deploy discover-proxy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing secret SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          bash scripts/deploy-discover-proxy.sh
